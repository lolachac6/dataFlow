<div [class]="this.button ? 'nodeStyleRed' : 'nodeStyle' ">
     <handle type="source" position="right" />
    @if(this.button){
    <h1><i class="fa-solid fa-circle-play fa-2xl" style="color: #b40404;" (mousemove)=" onNodeValueChange(this.ctx)" ></i></h1>
   
    }@else {
    <h1><i class="fa-solid fa-circle-play fa-2xl"></i></h1>
    }

</div>
