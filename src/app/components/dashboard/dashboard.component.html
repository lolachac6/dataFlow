<div class="wrapper">
    <div class="d-flex justify-content-end">
        <button class="btn btn-dark" (click)="checkStart()">Start</button>
    </div>

    <div class="workFlow shadow">
        <vflow [background]="{type: 'dots'}" [minZoom]="1" [maxZoom]="1" view="auto" [nodes]="node" [edges]="edges"
            (onConnect)="createEdge($event)" (onEdgesChange.add)="handleEdgesAddChange($event)">
            <ng-template id="y" let-ctx nodeHtml>
                @if(ctx.node.data.default === 'home'){
              
                <app-home-component [ctx]="ctx" [button]="enable" (messageEvent)="recoger($event)"></app-home-component>
                }
                @if(ctx.node.data.default === 'contract'){
                    <div class="nodeStyle">
                    <label>hola esto es una prueba</label>
                    @if(this.childInformation){
                        <p>😂</p>
                    }
                    <input value={{this.childInformation}}>
                </div>
                <handle type="target" position="left" />
                <handle type="source" position="right" />
                <node-toolbar>
                    <button>Delete</button>
                </node-toolbar>
                }
            </ng-template>
        </vflow>
    </div>
